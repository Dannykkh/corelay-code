name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build frontend
        run: |
          cd web && npm ci && npm run build && cd ..
          rm -f internal/server/webdist/assets/index-*.js internal/server/webdist/assets/index-*.css
          cp -r web/dist/* internal/server/webdist/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/Dannykkh/corelay-code/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/Dannykkh/corelay-code/internal/buildinfo.Commit=${{ github.sha }}" -o "corelaycode-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/proxy
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/Dannykkh/corelay-code/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/Dannykkh/corelay-code/internal/buildinfo.Commit=${{ github.sha }}" -o "corelaycode-acp-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/corelaycode-acp
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/Dannykkh/corelay-code/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/Dannykkh/corelay-code/internal/buildinfo.Commit=${{ github.sha }}" -o "corelaycode-profile-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/corelaycode-profile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelaycode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: corelaycode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify package smoke metadata and checksums
        shell: bash
        run: |
          expected=(
            "corelaycode-${{ github.ref_name }}-linux-amd64"
            "corelaycode-${{ github.ref_name }}-linux-arm64"
            "corelaycode-${{ github.ref_name }}-darwin-amd64"
            "corelaycode-${{ github.ref_name }}-darwin-arm64"
            "corelaycode-${{ github.ref_name }}-windows-amd64.exe"
            "corelaycode-acp-${{ github.ref_name }}-linux-amd64"
            "corelaycode-acp-${{ github.ref_name }}-linux-arm64"
            "corelaycode-acp-${{ github.ref_name }}-darwin-amd64"
            "corelaycode-acp-${{ github.ref_name }}-darwin-arm64"
            "corelaycode-acp-${{ github.ref_name }}-windows-amd64.exe"
            "corelaycode-profile-${{ github.ref_name }}-linux-amd64"
            "corelaycode-profile-${{ github.ref_name }}-linux-arm64"
            "corelaycode-profile-${{ github.ref_name }}-darwin-amd64"
            "corelaycode-profile-${{ github.ref_name }}-darwin-arm64"
            "corelaycode-profile-${{ github.ref_name }}-windows-amd64.exe"
          )
          for artifact in "${expected[@]}"; do test -f "$artifact"; done
          test "$(find . -maxdepth 1 -type f -name 'corelaycode-*' | wc -l)" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > checksums.txt
          test "$(wc -l < checksums.txt)" -eq "${#expected[@]}"
          test -s checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            corelaycode-*
            checksums.txt
          generate_release_notes: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CORELAY_VERSION=${{ github.ref_name }}
            CORELAY_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/dannykkh/corelaycode:${{ github.ref_name }}
            ghcr.io/dannykkh/corelaycode:latest
