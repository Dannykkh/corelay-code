name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build frontend
        run: |
          cd web && npm ci && npm run build && cd ..
          rm -f internal/server/webdist/assets/index-*.js internal/server/webdist/assets/index-*.css
          cp -r web/dist/* internal/server/webdist/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "corelaycode-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/proxy
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o "corelaycode-acp-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/corelaycode-acp
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "corelaycode-profile-${{ github.ref_name }}-${GOOS}-${GOARCH}${EXT}" ./cmd/corelaycode-profile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: corelaycode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: corelaycode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: corelaycode-*
          generate_release_notes: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dannykkh/corelaycode:${{ github.ref_name }}
            ghcr.io/dannykkh/corelaycode:latest
