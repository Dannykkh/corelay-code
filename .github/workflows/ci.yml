name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Test all packages
        run: go test ./... -count=1

      - name: Repeat platform sandbox contracts
        run: go test ./internal/sandbox ./internal/processsupervisor -count=3

      - name: Vet
        run: go vet ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install Linux sandbox backend
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Race-test concurrent runtime boundaries
        run: go test -race ./internal/approval ./internal/agent ./internal/acpbridge ./internal/server -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Build
        run: cd web && npm run build
