name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Install pinned gopls for Q15 semantic fixture
        shell: bash
        run: |
          GOTOOLCHAIN=auto GOBIN="$RUNNER_TEMP/corelay-gopls" go install golang.org/x/tools/gopls@v0.23.0
          echo "$RUNNER_TEMP/corelay-gopls" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/corelay-gopls:$PATH"
          gopls version

      - name: Roadmap Q01-Q16 and migration contracts
        shell: bash
        run: bash scripts/roadmap-qa.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux sandbox backend
        shell: bash
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Race-test concurrent runtime boundaries
        run: go test -race ./internal/approval ./internal/agent ./internal/acpbridge ./internal/server -count=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Test stream handling
        run: cd web && npm run test:sse

      - name: Build
        run: cd web && npm run build
